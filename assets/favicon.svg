<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo azul sólido con el tono exacto de la imagen -->
    <linearGradient id="bgBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Caja contenedora con curva suave exactas -->
  <rect x="0" y="0" width="512" height="512" rx="140" fill="url(#bgBlue)" />

  <!-- Símbolo de traducción exacto en color blanco -->
  <g fill="#ffffff">
    <!-- Punto superior del carácter de idioma -->
    <circle cx="210" cy="120" r="14" />
    
    <!-- Barra horizontal superior -->
    <rect x="150" y="152" width="120" height="24" rx="12" />
    
    <!-- Trazo en 'X' / Cruz del carácter -->
    <path d="M 180 186 L 240 256 L 220 272 L 160 202 Z" />
    <path d="M 240 186 L 180 256 L 200 272 L 260 202 Z" />
    
    <!-- Letra 'A' estilizada inferior -->
    <path d="M 310 210 L 260 370 L 290 370 L 305 320 L 355 320 L 370 370 L 400 370 L 350 210 Z M 330 235 L 348 295 L 312 295 Z" />
  </g>
</svg>