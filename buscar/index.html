<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Lecciones | EnglishMaster</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://englishmaster.quantumaudiostudio.com/buscar/">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        },
                        chicDark: '#0f172a',
                        chicGray: '#f8fafc',
                        chicBorder: '#e2e8f0'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                        heading: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex flex-col min-h-screen">

    <!-- Header Principal -->
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-chicBorder shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="../" class="flex items-center gap-2 group">
                        <div class="w-10 h-10 bg-brand-600 group-hover:bg-brand-700 text-white rounded-xl flex items-center justify-center font-heading font-extrabold text-xl shadow-md transition">
                            EM
                        </div>
                        <span class="font-heading font-extrabold text-2xl tracking-tight text-slate-900">
                            English<span class="text-brand-600">master</span>
                        </span>
                    </a>
                </div>

                <!-- Contenedor derecho (Navegación y Botón móvil) -->
                <div class="flex items-center gap-6">
                    <!-- Menú Navegación -->
                    <nav class="hidden lg:flex items-center font-medium text-slate-700 text-sm">
                        <a href="../" class="hover:text-brand-600 transition">Inicio</a>
                    </nav>

                    <!-- Botón Menú Móvil -->
                    <div class="flex lg:hidden items-center">
                        <button id="mobileMenuBtn" aria-label="Abrir menú" class="p-2 text-slate-600 hover:text-slate-900 focus:outline-none">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </button>
                    </div>
                </div> 
            </div>
        </div>

        <!-- Menú Desplegable Móvil -->
        <div id="mobileMenu" class="hidden lg:hidden bg-white border-b border-chicBorder px-4 pt-2 pb-6 space-y-3">
            <a href="../" class="block font-medium text-slate-700 hover:text-brand-600 py-1">Inicio</a>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8 space-y-6">
        <h1 class="text-2xl font-extrabold text-slate-900">Buscador de Lecciones</h1>
        
        <!-- Input de búsqueda -->
        <div class="relative">
            <input type="text" id="searchInput" placeholder="Escribe una palabra clave (ej. verbo to be, phrasal verbs...)" class="w-full bg-white border border-slate-300 text-slate-900 text-sm rounded-xl py-3 pl-4 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
        </div>

        <p id="resultCount" class="text-xs text-slate-500"></p>
        
        <!-- Contenedor de resultados -->
        <div id="resultsContainer" class="space-y-4">
            <p class="text-xs text-slate-400 text-center py-8">Empieza a escribir arriba para buscar entre todas las lecciones.</p>
        </div>
    </main>

    <script>
        let articles = [];

        // Cargar el JSON de artículos al abrir la página
        async function loadArticles() {
            try {
                const response = await fetch('../articulos.json');
                articles = await response.json();
            } catch (e) {
                console.error("Error cargando el índice de artículos", e);
            }
        }

        loadArticles();

        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultCount = document.getElementById('resultCount');

        // Leer parámetro 'q' de la URL si el usuario viene del formulario del header
        const urlParams = new URLSearchParams(window.location.search);
        const queryParam = urlParams.get('q');
        if (queryParam) {
            searchInput.value = queryParam;
            setTimeout(() => performSearch(queryParam), 300);
        }

        searchInput.addEventListener('input', (e) => {
            performSearch(e.target.value);
        });

        function performSearch(query) {
            const q = query.trim().toLowerCase();
            if (!q) {
                resultsContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">Empieza a escribir arriba para buscar entre todas las lecciones.</p>';
                resultCount.textContent = '';
                return;
            }

            const filtered = articles.filter(art => 
                (art.titulo && art.titulo.toLowerCase().includes(q)) ||
                (art.descripcion && art.descripcion.toLowerCase().includes(q)) ||
                (art.slug && art.slug.toLowerCase().includes(q))
            );

            resultCount.textContent = `Se encontraron ${filtered.length} lecciones relacionadas.`;

            if (filtered.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="bg-white p-8 rounded-xl border border-slate-200 text-center space-y-2">
                        <p class="text-sm font-semibold text-slate-700">No encontramos lecciones que coincidan con "${query}".</p>
                        <p class="text-xs text-slate-400">Intenta buscar con otros términos o explora las categorías principales.</p>
                    </div>
                `;
                return;
            }

            resultsContainer.innerHTML = filtered.map(art => {
                const cat = art.categoria || 'blog';
                const slug = art.slug || '';
                const titulo = art.titulo || '';
                const desc = art.descripcion || '';
                const url = `../${cat}/${slug}/;`.replace(';', '');
                
                return `
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-2 hover:border-blue-300 transition">
                    <span class="text-[10px] uppercase font-bold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-full">${cat}</span>
                    <h2 class="text-lg font-bold text-slate-900"><a href="${url}" class="hover:text-blue-600 transition">${titulo}</a></h2>
                    <p class="text-xs text-slate-600">${desc}</p>
                </div>
                `;
            }).join('');
        }
        document.getElementById('mobileMenuBtn').addEventListener('click', function() {
            var menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
